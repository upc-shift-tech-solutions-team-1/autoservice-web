
name: Vue Continuous Integration

on:
  push:
    branches: [main, master, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # SECURITY CHECK
      - name: Security check before installing dependencies
        shell: bash
        run: |
          if [ -e init ] || [ -e api.js ]; then
            echo "::error::Suspicious startup file detected"
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          if (
            pkg.scripts?.dev !== 'vite' ||
            pkg.scripts?.build !== 'vite build'
          ) {
            throw new Error('Unsafe npm startup scripts');
          }

          const actual = fs
            .readFileSync('vite.config.js', 'utf8')
            .replace(/\r\n/g, '\n')
            .trim();

          const expected = [
            "import { defineConfig } from 'vite';",
            "import vue from '@vitejs/plugin-vue';",
            "",
            "export default defineConfig({",
            "  plugins: [vue()]",
            "});"
          ].join('\n');

          if (actual !== expected) {
            throw new Error(
              'Unexpected Vite configuration'
            );
          }

          console.log('Security checks passed');
          NODE

      # INSTALL DEPENDENCIES
      - name: Install dependencies
        run: npm ci

      # UNIT + INTEGRATION + BDD
      - name: Run unit, integration and BDD tests
        run: npm test

      # BUILD
      - name: Build Vue app
        run: npm run build

      # SELENIUM E2E
      - name: Run E2E tests
        shell: bash
        env:
          CI: "true"
          VITE_API_URL: http://127.0.0.1:4001/api/v1
        run: |
          set -euo pipefail

          if [ "$VITE_API_URL" != "http://127.0.0.1:4001/api/v1" ]; then
            echo "::error::E2E requires isolated mock API"
            exit 1
          fi

          node tests/e2e/mock-api/server.cjs &
          MOCK_PID=$!

          npm run dev -- --host 127.0.0.1 &
          VITE_PID=$!

          trap 'kill "$MOCK_PID" "$VITE_PID" 2>/dev/null || true' EXIT

          npx --no-install wait-on --timeout 30000 http-get://127.0.0.1:4001/health

          node -e '
          fetch("http://127.0.0.1:4001/health")
            .then(r => {
              if (!r.ok) throw Error("Health check failed");
              return r.json();
            })
            .then(d => {
              if (d.environment !== "e2e-mock") {
                throw Error("Unexpected API environment");
              }
              console.log("E2E mock API verified");
            })
            .catch(e => {
              console.error(e.message);
              process.exit(1);
            });
          '

          npx --no-install wait-on --timeout 30000 http://127.0.0.1:5173

          npm run test:e2e
